name: daily-run
on:
  # Primary: Cloud Scheduler (arena-daily-run: 40 14,20 * * 1-5 UTC) via
  # workflow_dispatch. Backup: GH cron 10 min later — safe to double-fire
  # because jobs/dispatch.py skips agents that already ran this slot today,
  # so the backup no-ops whenever the primary fired. All active agents run
  # both slots; the slot is inferred from the UTC hour when the input is
  # blank (schedule events have no inputs): <17:00 = 'open', else 'close'.
  schedule:
    - cron: "50 14,20 * * 1-5"
  workflow_dispatch:
    inputs:
      slot:
        description: "open | close (blank = infer from current UTC hour)"
        required: false
        default: ""

concurrency:
  group: brains
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q "psycopg[binary]" requests sentry-sdk
      - name: Clone trader-arena (journals)
        env:
          TRADER_SSH_KEY: ${{ secrets.TRADER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && echo "$TRADER_SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" \
            git clone -q --branch claude/arena git@github.com:TomHaramaty/trader-arena.git trader
          git -C trader config user.name "arena-bot"
          git -C trader config user.email "arena-bot@users.noreply.github.com"
      - name: Run all brains
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DAILY_SLOT: ${{ inputs.slot }}
          TRADER_REPO: ${{ github.workspace }}/trader
          GIT_SSH_COMMAND: ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes
        run: python -m jobs.dispatch
      - name: Build arena.json
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TRADER_REPO: ${{ github.workspace }}/trader
        run: python -m jobs.site
      - name: Push data to arena-web
        if: always()
        env:
          ARENA_WEB_SSH_KEY: ${{ secrets.ARENA_WEB_SSH_KEY }}
        run: |
          echo "$ARENA_WEB_SSH_KEY" > ~/.ssh/arena_web_key && chmod 600 ~/.ssh/arena_web_key
          GIT_SSH_COMMAND="ssh -i ~/.ssh/arena_web_key -o IdentitiesOnly=yes" \
            git clone -q --depth 1 git@github.com:TomHaramaty/arena-web.git webrepo
          cp site/arena.json webrepo/data/arena.json
          cd webrepo
          git config user.name "arena-bot" && git config user.email "arena-bot@users.noreply.github.com"
          git add data/arena.json
          git diff --cached --quiet && echo "no data changes" || {
            git commit -q -m "data: post-run refresh"
            GIT_SSH_COMMAND="ssh -i ~/.ssh/arena_web_key -o IdentitiesOnly=yes" git push -q
          }
