name: daily-run
on:
  # Primary: Cloud Scheduler (arena-daily-run: 40 14,20 * * 1-5 UTC) via
  # workflow_dispatch. Backup: GH cron 10 min later — safe to double-fire
  # because jobs/dispatch.py skips agents that already ran this slot today,
  # so the backup no-ops whenever the primary fired. All active agents run
  # both slots; the slot is inferred from the UTC hour when the input is
  # blank (schedule events have no inputs): <17:00 = 'open', else 'close'.
  schedule:
    - cron: "50 14,20 * * 1-5"
  workflow_dispatch:
    inputs:
      slot:
        description: "open | close (blank = infer from current UTC hour)"
        required: false
        default: ""

concurrency:
  group: brains
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q "psycopg[binary]" requests google-cloud-firestore sentry-sdk
      - name: Clone trader-arena (journals)
        env:
          TRADER_SSH_KEY: ${{ secrets.TRADER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && echo "$TRADER_SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" \
            git clone -q --branch claude/arena git@github.com:TomHaramaty/trader-arena.git trader
          git -C trader config user.name "arena-bot"
          git -C trader config user.email "arena-bot@users.noreply.github.com"
      - name: Take guidance from the desks (before the bell)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TRADER_REPO: ${{ github.workspace }}/trader
          GIT_SSH_COMMAND: ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes
          FIRESTORE_SERVICE_ACCOUNT: ${{ secrets.FIRESTORE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIRESTORE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/fs_sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/fs_sa.json" python -m jobs.guidance
      # FINNHUB_KEY: a brain resolves and prices a symbol it asks for
      # (watchlist_request). Without it the operation cannot be honoured, and
      # it never was until 2026-08-01 — the key was set on the market-data step
      # of the tick alone, so every request an agent ever filed was refused.
      - name: Run all brains
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          DAILY_SLOT: ${{ inputs.slot }}
          TRADER_REPO: ${{ github.workspace }}/trader
          GIT_SSH_COMMAND: ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes
        run: python -m jobs.dispatch
      - name: Answer the desks
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TRADER_REPO: ${{ github.workspace }}/trader
          GIT_SSH_COMMAND: ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes
          FIRESTORE_SERVICE_ACCOUNT: ${{ secrets.FIRESTORE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIRESTORE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/fs_sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/fs_sa.json" python -m jobs.guidance
      - name: Build arena.json
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TRADER_REPO: ${{ github.workspace }}/trader
        run: python -m jobs.site
      # After the build, and only on the close slot: the day is complete, and a
      # letter about half a day is a letter about nothing. Reads the build this
      # run just produced rather than the published copy, which lags a push and
      # a deploy. Never fails the run — the record is already written, and a
      # letter that could not be composed must not undo that.
      - name: Write the letters (close slot only)
        if: always() && github.event.schedule != '50 14 * * 1-5'
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FIRESTORE_SERVICE_ACCOUNT: ${{ secrets.FIRESTORE_SERVICE_ACCOUNT }}
        run: |
          hour=$(date -u +%H)
          if [ "$hour" -lt 17 ]; then echo "open slot — letters wait for the close"; exit 0; fi
          printf '%s' "$FIRESTORE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/fs_sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/fs_sa.json" python -m jobs.letter --send
      # A finished interview nobody countersigned produces nothing and tells
      # nobody. One letter, once, per principal, ever: the guard is a partial
      # unique index on the nudges table, not a check in code. Close slot only,
      # for the same reason the letters are.
      - name: Write to the ones who never sat down (close slot only)
        if: always() && github.event.schedule != '50 14 * * 1-5'
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FIRESTORE_SERVICE_ACCOUNT: ${{ secrets.FIRESTORE_SERVICE_ACCOUNT }}
        run: |
          hour=$(date -u +%H)
          if [ "$hour" -lt 17 ]; then echo "open slot — the nudge waits for the close"; exit 0; fi
          printf '%s' "$FIRESTORE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/fs_sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/fs_sa.json" python -m jobs.nudge --send
      - name: Push data to arena-web
        if: always()
        env:
          ARENA_WEB_SSH_KEY: ${{ secrets.ARENA_WEB_SSH_KEY }}
        run: |
          bash tools/publish_arena.sh "data: post-run refresh"
