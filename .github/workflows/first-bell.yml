name: first-bell
# The principal clicked "Run the first session" on the status card. The
# ringFirstBell Cloud Function (open-outcry project) verified ownership, set
# bell.stage=ringing on the application doc, and fired this repository_dispatch
# with the application id. Here: seat the applicant (idempotent — the hourly
# tick ingest remains the safety net), run the agent's real first session, and
# publish, writing honest stages to the doc as each thing actually happens.
on:
  repository_dispatch:
    types: [first-bell]

concurrency:
  group: brains          # never run alongside the daily bell
  cancel-in-progress: false

jobs:
  first-bell:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q "psycopg[binary]" requests google-cloud-firestore sentry-sdk
      - name: Firestore credentials
        env:
          FIRESTORE_SERVICE_ACCOUNT: ${{ secrets.FIRESTORE_SERVICE_ACCOUNT }}
        run: printf '%s' "$FIRESTORE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/fs_sa.json"
      - name: Setup SSH keys
        env:
          TRADER_SSH_KEY: ${{ secrets.TRADER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$TRADER_SSH_KEY" > ~/.ssh/trader_key && chmod 600 ~/.ssh/trader_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
      - name: Clone trader-arena (prose)
        run: |
          GIT_SSH_COMMAND="ssh -i ~/.ssh/trader_key -o IdentitiesOnly=yes" \
            git clone -q --branch claude/arena git@github.com:TomHaramaty/trader-arena.git trader
          git -C trader config user.name "arena-bot"
          git -C trader config user.email "arena-bot@users.noreply.github.com"
      - name: Seat (stage seating)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TRADER_REPO: ${{ github.workspace }}/trader
          GIT_SSH_COMMAND: ssh -i ~/.ssh/trader_key -o IdentitiesOnly=yes
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/fs_sa.json
          APP_ID: ${{ github.event.client_payload.app_id }}
          # the founder's welcome goes out at seating (jobs/welcome.py)
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          python -m jobs.bell "$APP_ID" seating
          python -m jobs.ingest
          python -m jobs.credit
      - name: Resolve the seated agent
        id: agent
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/fs_sa.json
          APP_ID: ${{ github.event.client_payload.app_id }}
        run: |
          OUT=$(python -m jobs.bell "$APP_ID" --get-agent)
          echo "resolved: $OUT"
          echo "status=${OUT%%:*}" >> "$GITHUB_OUTPUT"
          echo "id=${OUT#*:}" >> "$GITHUB_OUTPUT"
      - name: Rejection is a terminal stage
        if: steps.agent.outputs.status == 'rejected'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/fs_sa.json
          APP_ID: ${{ github.event.client_payload.app_id }}
        run: |
          python -m jobs.bell "$APP_ID" failed
          echo "application rejected by seating validation — nothing to run"
      - name: First session (stage first-session)
        if: steps.agent.outputs.status == 'seated' && steps.agent.outputs.id != ''
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          TRADER_REPO: ${{ github.workspace }}/trader
          GIT_SSH_COMMAND: ssh -i ~/.ssh/trader_key -o IdentitiesOnly=yes
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/fs_sa.json
          APP_ID: ${{ github.event.client_payload.app_id }}
        run: |
          python -m jobs.bell "$APP_ID" first-session
          python -m jobs.agent_run "${{ steps.agent.outputs.id }}" --trigger first-bell
      # The entry exists now, but the floor is a build artifact — the trader is
      # not on it until arena.json is published AND arena-web has redeployed.
      # So publishing is its own stage the principal watches, and `done` waits
      # for the floor to actually serve the trader (below). Anything else hands
      # them a "watch it on the floor" link that lands on a floor without it.
      - name: Publish to the floor (stage publishing)
        if: steps.agent.outputs.status == 'seated'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TRADER_REPO: ${{ github.workspace }}/trader
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/fs_sa.json
          APP_ID: ${{ github.event.client_payload.app_id }}
          ARENA_WEB_SSH_KEY: ${{ secrets.ARENA_WEB_SSH_KEY }}
        run: |
          python -m jobs.bell "$APP_ID" publishing
          python -m jobs.site
          bash tools/publish_arena.sh "data: first bell"
      - name: The floor has it (stage done)
        if: steps.agent.outputs.status == 'seated' && steps.agent.outputs.id != ''
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/fs_sa.json
          APP_ID: ${{ github.event.client_payload.app_id }}
        run: |
          python -m jobs.bell "$APP_ID" --await-floor "${{ steps.agent.outputs.id }}"
          python -m jobs.bell "$APP_ID" done
      - name: Honest failure stage
        if: failure()
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/fs_sa.json
          APP_ID: ${{ github.event.client_payload.app_id }}
        run: python -m jobs.bell "$APP_ID" failed || true
