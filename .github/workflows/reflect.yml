name: reflect

on:
  # Primary: Cloud Scheduler (arena-reflect: 30 21 * * 5 UTC) via
  # workflow_dispatch. Backup: GH cron 15 min later — reflect_run --due is
  # idempotent (a completed reflection closes its own due window), so a
  # double fire no-ops.
  schedule:
    - cron: "45 21 * * 5"
  workflow_dispatch: {}

concurrency:
  group: brains
  cancel-in-progress: false

jobs:
  reflect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q "psycopg[binary]" requests google-cloud-firestore sentry-sdk
      - name: Setup SSH + clone trader-arena
        env:
          TRADER_SSH_KEY: ${{ secrets.TRADER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$TRADER_SSH_KEY" > ~/.ssh/trader_key && chmod 600 ~/.ssh/trader_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          GIT_SSH_COMMAND="ssh -i ~/.ssh/trader_key -o IdentitiesOnly=yes" \
            git clone -q --branch claude/arena git@github.com:TomHaramaty/trader-arena.git trader
          git -C trader config user.name "arena-bot"
          git -C trader config user.email "arena-bot@users.noreply.github.com"
      - name: Run due reflections
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TRADER_REPO: ${{ github.workspace }}/trader
          GIT_SSH_COMMAND: ssh -i ~/.ssh/trader_key -o IdentitiesOnly=yes
        run: python -m jobs.reflect_run --due
      - name: Build arena.json
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TRADER_REPO: ${{ github.workspace }}/trader
        run: python -m jobs.site
      # The weekly letter rides the reflection, not the Friday close: reflection
      # is when a hypothesis is promoted or falsified and the rulebook actually
      # changes. "Here is what I changed my mind about" is the product's thesis
      # in an inbox; five daily letters stapled together is filler.
      - name: Write the weekly letters
        if: always()
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FIRESTORE_SERVICE_ACCOUNT: ${{ secrets.FIRESTORE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIRESTORE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/fs_sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/fs_sa.json" \
            python -m jobs.letter --reflection --send
      - name: Push data to arena-web
        if: always()
        env:
          ARENA_WEB_SSH_KEY: ${{ secrets.ARENA_WEB_SSH_KEY }}
        run: |
          bash tools/publish_arena.sh "data: post-reflection refresh"
