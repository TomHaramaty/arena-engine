name: tick
on:
  schedule:
    - cron: "7,37 * * * *"   # 2 attempts/hour — GH cron is best-effort, over-provision
  workflow_dispatch: {}

concurrency:
  group: tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q "psycopg[binary]" requests google-cloud-firestore sentry-sdk
      - name: Run tick
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: python -m jobs.tick
      - name: Setup SSH keys
        env:
          TRADER_SSH_KEY: ${{ secrets.TRADER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$TRADER_SSH_KEY" > ~/.ssh/trader_key && chmod 600 ~/.ssh/trader_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
      - name: Clone trader-arena (prose)
        run: |
          GIT_SSH_COMMAND="ssh -i ~/.ssh/trader_key -o IdentitiesOnly=yes" \
            git clone -q --branch claude/arena git@github.com:TomHaramaty/trader-arena.git trader
          git -C trader config user.name "arena-bot"
          git -C trader config user.email "arena-bot@users.noreply.github.com"
      - name: Wake triggered agents
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TRADER_REPO: ${{ github.workspace }}/trader
          GIT_SSH_COMMAND: ssh -i ~/.ssh/trader_key -o IdentitiesOnly=yes
        run: python -m jobs.dispatch --triggers-only
      - name: Ingest seat applications
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TRADER_REPO: ${{ github.workspace }}/trader
          GIT_SSH_COMMAND: ssh -i ~/.ssh/trader_key -o IdentitiesOnly=yes
          FIRESTORE_SERVICE_ACCOUNT: ${{ secrets.FIRESTORE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIRESTORE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/fs_sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/fs_sa.json" python -m jobs.ingest
      - name: Sync who is named on the floor
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FIRESTORE_SERVICE_ACCOUNT: ${{ secrets.FIRESTORE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIRESTORE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/fs_sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/fs_sa.json" python -m jobs.credit
      - name: Take guidance from the desks
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TRADER_REPO: ${{ github.workspace }}/trader
          GIT_SSH_COMMAND: ssh -i ~/.ssh/trader_key -o IdentitiesOnly=yes
          FIRESTORE_SERVICE_ACCOUNT: ${{ secrets.FIRESTORE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIRESTORE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/fs_sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/fs_sa.json" python -m jobs.guidance
      - name: Build arena.json
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TRADER_REPO: ${{ github.workspace }}/trader
        run: python -m jobs.site
      - name: Push data to arena-web
        env:
          ARENA_WEB_SSH_KEY: ${{ secrets.ARENA_WEB_SSH_KEY }}
        run: |
          echo "$ARENA_WEB_SSH_KEY" > ~/.ssh/arena_web_key && chmod 600 ~/.ssh/arena_web_key
          GIT_SSH_COMMAND="ssh -i ~/.ssh/arena_web_key -o IdentitiesOnly=yes" \
            git clone -q --depth 1 git@github.com:TomHaramaty/arena-web.git webrepo
          cp site/arena.json webrepo/data/arena.json
          cd webrepo
          git config user.name "arena-bot" && git config user.email "arena-bot@users.noreply.github.com"
          git add data/arena.json
          git diff --cached --quiet && echo "no data changes" || {
            git commit -q -m "data: tick refresh"
            GIT_SSH_COMMAND="ssh -i ~/.ssh/arena_web_key -o IdentitiesOnly=yes" git push -q
          }
